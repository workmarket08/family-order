@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{--ink:#1a1a1a;--sub:#777;--line:#ececec;--bg:#fafafa;--pink:#e85a8a;--pink-d:#d6447a;--pos:#1f9d55;--surface:#fff;}
*{box-sizing:border-box;}
.fo-app{font-family:'Zen Kaku Gothic New',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;}
.fo-loading{padding:60px;text-align:center;color:var(--sub);}
.fo-btn{border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;padding:11px 14px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;}
.fo-btn-primary{background:var(--pink);color:#fff;}
.fo-btn-primary:hover{background:var(--pink-d);}
.fo-btn-primary:disabled{background:#e7b9cb;cursor:not-allowed;}
.fo-btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.fo-btn-ghost:disabled{color:#bbb;cursor:not-allowed;}
.fo-btn-buy{background:#5bb8e6;color:#fff;}
.fo-btn-buy:hover{background:#3fa8db;}
.fo-btn-deliver{background:#a8dcb0;color:#1f6b33;}
.fo-btn-deliver:hover{background:#92d09c;}
.fo-btn-pay{background:#c9ccd2;color:#1a1a1a;}
.fo-btn-pay:hover{background:#bcbfc6;}
.fo-block{width:100%;}
.fo-sm{padding:8px 10px;font-size:13px;}
.fo-xs{padding:5px 8px;font-size:12px;border-radius:8px;}
.fo-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;}
.fo-input:focus{outline:2px solid #f3c9d8;border-color:var(--pink);}
.fo-field{display:block;margin-bottom:12px;}
.fo-field>span{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:500;}
.fo-required{display:block;margin-top:4px;font-size:11px;color:#e8484f;font-weight:700;}
.fo-mini{font-size:11.5px;color:var(--sub);margin:6px 0;line-height:1.6;}
.fo-warn{background:#fdecef;color:var(--pink-d);border:1px solid #f5c6d4;border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0;}
.fo-warn.sm{padding:5px 8px;font-size:12px;}
.fo-err{background:#fdecea;color:#c0392b;border:1px solid #f3c9c4;border-radius:8px;padding:9px 11px;font-size:13px;margin:10px 0;}
/* login */
.fo-login{min-height:100vh;display:grid;place-items:center;padding:20px;}
.fo-login-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 22px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.05);}
.fo-logo-big{font-weight:700;font-size:26px;letter-spacing:.06em;text-align:center;margin-bottom:6px;}
.fo-logo-big span{color:var(--pink);}
.fo-login-lead{text-align:center;color:var(--sub);font-size:13px;margin:0 0 18px;}
/* header */
.fo-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px;}
.fo-iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:none;background:none;color:var(--ink);cursor:pointer;position:relative;}
.fo-iconbtn:hover{background:#f3f3f3;}
.fo-logo{font-weight:700;letter-spacing:.04em;font-size:15px;cursor:pointer;white-space:nowrap;}
.fo-logo span{color:var(--pink);}
.fo-search{flex:1;display:flex;align-items:center;gap:6px;background:#f3f3f3;border-radius:20px;padding:7px 12px;color:var(--sub);}
.fo-search input{border:none;background:none;outline:none;font-size:14px;width:100%;font-family:inherit;}
.fo-search-x{border:none;background:none;cursor:pointer;color:var(--sub);display:grid;place-items:center;}
/* category bar (\u6A2A\u4E26\u3073) */
.fo-catbar{position:sticky;top:53px;z-index:15;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:9px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:720px;margin:0 auto;}
.fo-catbar::-webkit-scrollbar{display:none;}
.fo-catchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;}
.fo-catchip:hover{border-color:#ddd;}
.fo-catchip.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700;}
.fo-catchip-ic{font-size:14px;}
/* main */
.fo-main{max-width:720px;margin:0 auto;padding:14px 12px 120px;}
.fo-listtitle{font-weight:700;font-size:17px;margin:6px 2px 12px;}
.fo-empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px;line-height:2;}
/* grid */
.fo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:560px){.fo-grid{grid-template-columns:repeat(3,1fr);}}
.fo-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px;}
.fo-card.static{cursor:default;}
.fo-card:hover:not(.static){border-color:#ddd;}
.fo-thumb{position:relative;width:100%;aspect-ratio:1;background:#f5f5f5;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:5px;}
.fo-thumb img{max-width:100%;max-height:100%;object-fit:contain;}
.fo-noimg{font-size:34px;}
.fo-noimg.lg{font-size:64px;}
.fo-soldtag{position:absolute;top:6px;left:6px;background:rgba(26,26,26,.82);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.fo-soldtag.inline{position:static;display:inline-block;margin-left:6px;background:#999;}
.fo-card-name{font-size:13px;font-weight:500;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.fo-card-price{font-weight:700;font-size:14px;}
.fo-card-price em{color:var(--sub);font-weight:500;font-size:12px;font-style:normal;}
.fo-card-cat,.fo-card-by{font-size:11px;color:var(--sub);}
/* detail */
.fo-detail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
.fo-back{border:none;background:none;color:var(--sub);font-size:13px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;padding:4px 0;margin-bottom:8px;font-family:inherit;}
.fo-detail-img{text-align:center;}
.fo-detail-box{display:inline-block;max-width:100%;background:#f5f5f5;border-radius:12px;overflow:hidden;line-height:0;}
.fo-detail-box img{display:block;max-width:100%;max-height:60vh;object-fit:contain;}
.fo-detail-ph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;background:#f5f5f5;border-radius:12px;}
.fo-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.fo-thumb-mini{width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#f5f5f5;display:flex;align-items:center;justify-content:center;}
.fo-thumb-mini.on{border-color:var(--pink);}
.fo-thumb-mini img{max-width:100%;max-height:100%;object-fit:contain;}
.fo-detail-name{font-size:18px;margin:14px 0 6px;}
.fo-detail-price{font-size:20px;font-weight:700;margin-bottom:10px;}
.fo-detail-price em{color:var(--sub);font-size:14px;font-weight:500;font-style:normal;}
.fo-detail-row{font-size:13px;margin:5px 0;color:#444;}
.fo-detail-row b{color:var(--sub);font-weight:500;margin-right:8px;font-size:12px;}
.fo-detail-row a{color:var(--pink-d);}
.fo-detail-cat{font-size:13px;color:var(--sub);margin:10px 0;}
.fo-qtyrow{display:flex;align-items:center;justify-content:space-between;margin:16px 0;font-size:14px;}
.fo-stepper{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:5px 12px;}
.fo-stepper.sm{padding:3px 8px;gap:10px;}
.fo-stepper button{border:none;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);}
.fo-stepper b{min-width:18px;text-align:center;}
.fo-addbtn{font-size:15px;padding:13px;}
.fo-sold-under{text-align:center;color:#999;font-weight:700;margin-top:8px;}
/* cart / rows */
.fo-cartrow,.fo-orow,.fo-arow,.fo-prow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
.fo-cartimg{width:64px;height:64px;border-radius:9px;overflow:hidden;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fo-cartimg.sm{width:48px;height:48px;}
.fo-cartimg img{max-width:100%;max-height:100%;object-fit:contain;}
.fo-cartmain{flex:1;min-width:0;}
.fo-cartname{font-size:14px;font-weight:500;line-height:1.4;}
.fo-cartprice{font-size:12px;color:var(--sub);margin-top:2px;}
.fo-cartmain .fo-stepper{margin-top:7px;}
.fo-cartright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.fo-cartsub{font-weight:700;font-size:14px;}
.fo-tiny{border:none;background:none;cursor:pointer;color:var(--sub);display:grid;place-items:center;padding:4px;}
.fo-tiny:hover{color:var(--pink-d);}
.fo-cartfoot{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
.fo-carttotal{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:14px;}
.fo-carttotal b{font-size:20px;}
/* tabs(seg) */
.fo-segtabs{display:flex;gap:6px;background:#f0f0f0;border-radius:11px;padding:4px;margin-bottom:14px;}
.fo-segtab{flex:1;border:none;background:none;border-radius:8px;padding:9px 4px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:5px;}
.fo-segtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.fo-cnt{background:#e0e0e0;color:#555;font-size:11px;border-radius:9px;padding:0 6px;font-weight:700;}
.fo-segtab.on .fo-cnt{background:var(--pink);color:#fff;}
.fo-subtotal{display:flex;justify-content:space-between;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;}
.fo-subtotal b{font-size:18px;}
.fo-pill{font-size:11px;font-weight:700;color:var(--sub);background:#f0f0f0;border-radius:999px;padding:3px 9px;white-space:nowrap;}
.fo-pill.buy{background:#dcf0fa;color:#2b88bd;}
.fo-pill.done{background:#e6f6ec;color:var(--pos);}
.fo-pill.paid{background:#d8dade;color:#1a1a1a;}
/* admin */
.fo-totals{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.fo-grand{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px;}
.fo-grand b{font-size:20px;}
.fo-perlist{display:flex;flex-direction:column;gap:0;}
.fo-per{display:flex;justify-content:space-between;font-size:13px;padding:8px 2px;border-bottom:1px solid var(--line);}
.fo-per:last-child{border-bottom:none;}
.fo-per b{font-weight:700;}
.fo-actionbar{display:flex;gap:8px;margin-bottom:4px;}
.fo-actionbar .fo-btn{flex:1;}
.fo-filters{display:flex;gap:8px;margin:9px 0 12px;}
.fo-filters .fo-input{flex:1;font-size:13px;padding:8px 10px;}
.fo-chk{display:grid;place-items:center;}
.fo-chk input{width:20px;height:20px;accent-color:var(--pink);}
.fo-arow.st-2{background:#fffdf6;}
.fo-arow.st-3{background:#f6fbf7;}
.fo-arow.st-4{background:#f3f3f5;}
.fo-dtable{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
.fo-dhead,.fo-drow{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:6px;padding:10px 11px;align-items:center;}
.fo-dhead{background:#f5f5f7;font-size:11px;color:var(--sub);font-weight:700;}
.fo-dhead span:not(:first-child),.fo-drow span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;}
.fo-drow{border-top:1px solid var(--line);font-size:13px;}
.fo-dname{font-weight:700;}
.fo-invlist{margin-top:6px;}
.fo-ihead,.fo-irow{display:grid;grid-template-columns:30px 1fr 1.1fr 1fr;gap:6px;padding:9px 11px;align-items:center;}
.fo-ihead{background:#f5f5f7;font-size:11px;color:var(--sub);font-weight:700;}
.fo-ihead span:last-child,.fo-irow span:last-child{text-align:right;font-variant-numeric:tabular-nums;}
.fo-irow{border-top:1px solid var(--line);font-size:13px;cursor:pointer;}
.fo-irow input{width:18px;height:18px;accent-color:var(--pink);}
/* \u8ACB\u6C42\u66F8\uFF08\u5370\u5237\u2192PDF\uFF09 */
#fo-print{display:none;}
.fo-inv{color:#111;padding:6px 4px;font-size:13px;}
.fo-inv-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #333;padding-bottom:12px;margin-bottom:16px;}
.fo-inv-to{font-size:22px;font-weight:800;}
.fo-inv-date{font-size:12px;color:#444;margin-top:8px;}
.fo-inv-doc{font-size:18px;font-weight:800;letter-spacing:.12em;}
.fo-inv-table{width:100%;border-collapse:collapse;font-size:13px;}
.fo-inv-table th,.fo-inv-table td{border-bottom:1px solid #ccc;padding:8px;text-align:left;}
.fo-inv-table th{background:#f0f0f0;}
.fo-inv-table tr{break-inside:avoid;}
.fo-inv-table .c{text-align:center;width:64px;}
.fo-inv-table .r{text-align:right;width:110px;font-variant-numeric:tabular-nums;}
.fo-inv-total{margin-top:18px;text-align:right;font-size:15px;}
.fo-inv-total b{font-size:22px;margin-left:10px;}
.fo-inv-rule{border:none;border-top:1px solid #333;margin:14px 0 10px;}
.fo-inv-from{text-align:right;font-size:13px;color:#111;}
@media print {
  #root{display:none !important;}        /* \u30A2\u30D7\u30EA\u672C\u4F53\u3092\u5370\u5237\u5BFE\u8C61\u304B\u3089\u5916\u3059\uFF1D\u7A7A\u767D2\u679A\u76EE\u3092\u51FA\u3055\u306A\u3044 */
  #fo-print{display:block;}
  .fo-inv + .fo-inv{break-before:page;}  /* \u6B21\u306E\u30E1\u30F3\u30D0\u30FC\u3067\u6539\u30DA\u30FC\u30B8 */
  @page{size:A4;margin:16mm;}
}
.fo-csv .fo-btn{margin-bottom:10px;}
.fo-impmsg{display:flex;align-items:center;gap:7px;background:#eef6ff;border:1px solid #cfe3fb;color:#1f5fa8;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:6px;}
.fo-counts{margin-top:12px;font-size:12px;color:var(--sub);text-align:center;}
/* drawer */
.fo-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:grid;place-items:center;padding:16px;}
.fo-overlay-left{place-items:stretch;}
.fo-drawer{background:#fff;width:280px;max-width:82vw;height:100%;border-radius:0 16px 16px 0;padding:10px;overflow:auto;animation:slidein .2s ease;}
@keyframes slidein{from{transform:translateX(-20px);opacity:.4;}to{transform:none;opacity:1;}}
.fo-drawer-head{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 12px;font-weight:700;}
.fo-draw-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:12px 10px;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
.fo-draw-item:hover{background:#f5f5f5;}
.fo-draw-item.on{background:#fdecef;color:var(--pink-d);font-weight:700;}
.fo-draw-ic{font-size:18px;}
/* modal */
.fo-modal{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.fo-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);}
.fo-modal-head h3{margin:0;font-size:16px;}
.fo-modal-body{padding:16px;overflow:auto;}
.fo-imgfields{margin-bottom:12px;display:flex;flex-direction:column;gap:7px;}
.fo-imgfields .fo-btn{align-self:flex-start;}
.fo-upgrid{display:flex;flex-wrap:wrap;gap:8px;}
.fo-upthumb{position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;background:#f5f5f5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.fo-upthumb img{max-width:100%;max-height:100%;object-fit:contain;}
.fo-upx{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.fo-upmain{position:absolute;left:0;bottom:0;background:var(--pink);color:#fff;font-size:9px;padding:1px 5px;border-top-right-radius:6px;}
.fo-uprow{display:flex;gap:6px;align-items:center;}
.fo-uprow .fo-input{flex:1;}
.fo-uprow .fo-btn{align-self:auto;white-space:nowrap;}
/* bottom nav */
.fo-tabs{position:fixed;bottom:30px;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;max-width:720px;margin:0 auto;}
.fo-tab{flex:1;border:none;background:none;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-size:10px;color:var(--sub);cursor:pointer;}
.fo-tab.on{color:var(--pink);}
.fo-tab span{font-weight:500;}
.fo-tab-ic{position:relative;display:grid;place-items:center;}
.fo-tabbadge{position:absolute;top:-6px;left:11px;background:var(--pink);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px;line-height:1;}
.fo-userbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:5px 12px;z-index:25;max-width:720px;margin:0 auto;font-size:11px;}
.fo-link{border:none;background:none;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:11px;}
.fo-link:hover{color:var(--ink);}
.fo-spacer{flex:1;}
.fo-who{color:var(--ink);font-weight:700;}
